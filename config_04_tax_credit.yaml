## Configuration for the Tourmaline tax-credit step.
## `tourmaline.sh --step tax-credit` evaluates reference databases using
## tax-credit simulation and classification benchmarks.

## --- CORE RUN SETTINGS ---
run_name: silva_tax_credit
output_dir: "../v2-results"
tax_credit_package_dir: "../tax-credit"

## --- REFERENCE DATABASES (one or more) ---
reference_databases:
  - id: silva
    refseqs_file: 00-data/silva-138_1-99-515f_926r-uniq-seq.qza
    taxa_file: 00-data/silva-138_1-99-515f_926r-uniq-tax.qza
    fwd_primer: GTGYCAGCMGCCGCGGTAA
    rev_primer: GGACTACNVGGGTWTCTAAT
    fwd_primer_id: parada-f
    rev_primer_id: parada-r
    read_length: 450
    min_read_length: 200
    trim_primers: false
    truncate: false
    # Optional (mock-community, naive-bayes only): classify mock ASVs with this
    # classifier .qza instead of fitting one on the full database
    pretrained_classifier:

## --- EVALUATION METHODS (one or more) ---
# cross-validated | cross-validated-trad | novel-taxa | self-validated | mock-community
evaluation_methods:
  - cross-validated
  - novel-taxa

## --- SIMULATION PARAMETERS ---
iterations: 10
novel_taxa_levels: [6, 5, 4, 3]
cv_recall_max_level: 6
novel_recall_min_level: 2
force_regenerate: false
format_reference_databases: false #not implemented yet

## --- TAXONOMIC ASSIGNMENT (shared) ---
# One or more methods to benchmark: naive-bayes | consensus-blast | consensus-vsearch | bt2-blca
classify_methods:
  - naive-bayes
  - consensus-vsearch
  - bt2-blca
classify_threads: 5
# Taxonomy ranks for bt2-blca output (comma-separated, no spaces)
taxa_ranks: kingdom,phylum,class,order,family,genus,species

## --- NAIVE-BAYES OPTIONS ---
# Optional: confidence threshold(s) for classify-sklearn; multiple values share one fitted classifier
nb_confidence_values: [0.7, 0.9]
# Optional: default when nb_confidence_values is omitted (naive-bayes only)
skl_confidence: 0.7
# Optional: extra parameters passed to fit-classifier-naive-bayes
fit_params: "--p-feat-ext--ngram-range '[7,7]' --p-classify--alpha 0.001"
# Optional: extra parameters passed to classify-sklearn (naive-bayes only)
naive_bayes_classify_params: ""
# Optional: full path to pretrained classifier (.qza); not used by tax-credit simulation folds
pretrained_classifier:

## --- CONSENSUS BLAST/VSEARCH OPTIONS ---
# Optional: minimum percent identity (0–1); single value or list to sweep (consensus methods)
perc_identity: 0.8
# Optional: minimum query coverage (0–1); single value or list to sweep (consensus methods)
query_cov: 0.8
# Optional: minimum consensus fraction (0–1); single value or list to sweep
min_consensus: 0.51
# Optional: extra parameters passed to consensus-blast or consensus-vsearch
consensus_classify_params: ""

## --- BT2-BLCA OPTIONS ---
# Optional: minimum percent identity (0–1) for BLCA hits (-b); single value or list to sweep
blca_perc_identity: 0.8
# Optional: minimum hit length relative to query (0–1) for BLCA hits (-l); single value or list to sweep
blca_query_cov: 0.8
# Optional: confidence threshold(s) for reformat_summary_for_r.py; multiple values share one
# Bowtie2 index per fold (same sharing pattern as naive-bayes classifiers)
# When blca_confidence_values is omitted, confidence_thres is used instead
blca_confidence_values: [0.8]
confidence_thres: 0.8
# Requires the bt2-blca conda environment (bowtie2, muscle); see docs/install.md

## --- OUTPUT LAYOUT ---
data_subdir: data
results_subdir: results

## --- PLOTTING ---
generate_plots: true
plots_subdir: plots
# Plot types to generate: boxplot | pointplot (line) | heatmap | stacked_bar | best_run_stacked_bar
plot_types:
  - boxplot
  - pointplot
  - heatmap
  - stacked_bar
  - best_run_stacked_bar
# Metrics for boxplots, per-level line plots, and heatmaps
plot_metrics:
  - Precision
  - Recall
  - F-measure
  - match_ratio
  - underclassification_ratio
  - overclassification_ratio
  - misclassification_ratio
# Optional: seaborn palette name or dict mapping Method -> color (default: fixed colourblind-safe colour per method)
plot_color_palette:
# Optional: heatmap row/column groupings (defaults match tax-credit notebooks)
plot_heatmap_rows: [Method, Parameters]
plot_heatmap_cols: [Dataset, level]
# Optional: ranks for boxplots, one panel each (phylum | class | order | family | genus | species)
plot_ranks: [genus, species]
# Optional: rank at which best_run_stacked_bar picks the best method + parameters per metric
best_run_rank: species

## --- LOG ANALYSIS (per-read classification_accuracy_log.tsv) ---
generate_log_analysis: true
log_analysis_rank: species   # rank for summary CSV tables
log_analysis_ranks: [species, genus, family]   # ranks for sensitivity plots/CSVs
log_analysis_min_obvs: 3   # minimum log observations per expected taxon
log_analysis_top_n: 25   # taxa per reference database in sensitivity heatmaps

## --- MOCK COMMUNITY (when mock-community is in evaluation_methods) ---
## See docs/configuration.md "Mock community evaluation" for file formats and metrics.
mock_community:
  # One or more sequencing datasets containing mock samples
  datasets:
    - id: my_mock_run
      # Read counts: TSV (ASVs as rows, samples as columns), .biom, or repseqs table.qza
      feature_table:
      # ASV sequences: FASTA or repseqs.qza (ids must match the feature table)
      rep_seqs:
      # Optional: evaluate only these samples
      samples:
  # One expected set per taxonomic backbone. Expected taxa must use the same
  # taxonomy as the databases listed. Set composition, asv_taxonomy, or both.
  expected_sets:
    - id: my_backbone
      # reference_databases ids that use this backbone (each database in one set only)
      databases: []
      # TSV: unique taxonomies as rows, sample ids as columns, relative abundance as values
      composition:
      # TSV with headers "Feature ID" and "Taxon": known taxonomy of each ASV
      # (enables precision / recall / F-measure; without composition, the
      # expected composition is built from these and the read counts)
      asv_taxonomy:
      # Optional: rank names for this set's taxonomy strings (default taxa_ranks)
      ranks:
  # Ranks to score
  eval_ranks: [family, genus, species]
  # Observed taxa must exceed this fraction of a sample's reads to count for TAR/TDR
  min_relative_abundance: 0
  # true: count taxa not resolved at a rank (and Unassigned) in TAR/TDR, as original tax-credit
  legacy_unresolved_taxa: false
  # warn | error: what to do when expected taxa are missing from, or placed differently in, a database
  backbone_check: warn
  # Optional: metrics to plot (default Taxon Accuracy Rate, Taxon Detection Rate, Bray-Curtis, Precision, Recall, F-measure)
  plot_metrics:
  # Taxa coloured individually in composition plots
  composition_top_n: 12

## --- ADVANCED ---
force_evaluation: false
exclude_databases: []
summary_filenames:
  cross-validated: evaluate_classification_summary_CV.csv
  novel-taxa: evaluate_classification_summary_novel.csv
  cross-validated-trad: evaluate_classification_summary_CV_trad.csv
  self-validated: evaluate_classification_summary_self_validated.csv
