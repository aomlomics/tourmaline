## Configuration for the Tourmaline taxonomy step.
## `tourmaline.sh --step taxonomy` passes these options to `taxonomy_step.Snakefile`
## to select reference databases or classifiers, set classification methods, and
## export per-feature taxonomy tables plus summary visualizations.

## --- CORE RUN SETTINGS ---
# Required: taxonomy run name (often derived from repseqs run).
run_name: test_data-nb
# Required: directory where taxonomy outputs and logs are stored.
output_dir: "../v2-results"

## --- INPUT DATA SOURCES (choose one approach) ---
# Optional: repseqs run name that produced inputs; defaults to `run_name`.
repseqs_run_name: test_data
# Optional: path to externally generated representative sequences artifact (.qza).
repseqs_qza_file: # if empty, will use file in run_name-repseqs/
# Optional: path to externally generated feature table artifact (.qza)
table_qza_file: # if empty, will use file in run_name-repseqs/
# Optional: sample metadata TSV/CSV for barplot visualization.
sample_metadata_file: 00-data/metadata.tsv

## --- DATABASE + CLASSIFICATION SETTINGS ---
# Descriptive name for reference database; used in analysisMetadata outputs.
database_name: "silva-138_1-99-515f_926r-uniq"
# Required, unless using pretrained classifier: reference sequences (FASTA or .qza) compatible with chosen method.
refseqs_file: "00-data/silva-138_1-99-515f_926r-uniq-seq.qza"
# Required, unless using pretrained classifier: reference taxonomy (TSV or .qza) compatible with chosen method.
taxa_file: "00-data/silva-138_1-99-515f_926r-uniq-tax.qza"
# Required: taxonomy assignment method (`naive-bayes`, `consensus-blast`, `consensus-vsearch`, `bt2-blca`).
classify_method: naive-bayes
# Required: ordered taxonomy ranks to expand in outputs (comma-separated).
taxa_ranks: kingdom,phylum,class,order,family,genus,species
# Optional: taxonomy level (1–7) for collapsed abundance table.
collapse_taxalevel: 7
# Optional: number of threads used by taxonomy commands.
classify_threads: 10

## --- NAIVE-BAYES OPTIONS ---
# Optional: full path to pretrained classifier (.qza); overrides refseqs_file/taxa_file when provided.
pretrained_classifier: 
# Optional: confidence threshold passed to QIIME2 `classify-sklearn`.
skl_confidence: 0.7

## --- CONSENSUS BLAST/VSEARCH OPTIONS ---
# Optional: minimum percent identity for sequence similarity classifiers (0–1).
perc_identity: 0.8
# Optional: minimum query coverage for sequence similarity classifiers (0–1).
query_cov: 0.8
# Optional: minimum consensus fraction required to assign taxonomy (0–1).
min_consensus: 0.51

## --- BT2-BLCA OPTIONS ---
# Optional: directory containing prebuilt bowtie2 index; leave blank to auto-build from refseqs_file and taxa_file.
bowtie_database: 
# Optional: BLCA confidence threshold for accepting assignments (0–1 scale).
confidence_thres: 0.8

## --- ADDITIONAL CLASSIFIER FLAGS ---
# Optional: extra command-line parameters appended to chosen classifier.
classify_params: --verbose
