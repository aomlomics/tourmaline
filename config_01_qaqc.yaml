run_name: test_data
output_dir: "../v2-results"
raw_fastq_path: #00-data/fastq/ #path to raw fastq files 
trimmed_fastq_path: #trimmed files must have suffix _R[1,2].fastq.gz
sample_manifest_file: 00-data/manifest_pe.csv # if provided and trimming, then import to raw_fastq.qza, then trim into a new trimmed_fastq.qza. 
preexisting_fastq_qza: #00-data/my_fastq.qza # Optional: path to a pre-existing fastq.qza file
#if provided and not trimming, just import to fastq.qza

paired_end: True #Boolean
to_trim: True #Boolean
to_merge: False #Boolean

# Get assay name from: https://github.com/NOAA-Omics/noaa-omics-metabarcoding-assays/blob/main/assays.tsv
assay_name: Bacteria-16S-V4V5-Parada 
# cutadapt parameters
fwd_primer: GTGYCAGCMGCCGCGGTAA
rev_primer: GGACTACNVGGGTWTCTAAT
discard_untrimmed: False
minimum_length: 50

# vsearch merge parameters, if `to_merge` is True
maxdiffs: 20 #default is 10
merge_stagger: --p-allowmergestagger # default is --p-no-allowmergestagger

# threads
trimming_threads: 5
#quality parameters
seq_quality_cutoff: 0.85 # not used  yet
